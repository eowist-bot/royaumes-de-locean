<!DOCTYPE html><html lang='fr'><head>
<meta charset='UTF-8'><title>Royaumes de l'Océan</title>
<link rel='stylesheet' href='css/style.css'></head><body>
<h1>🌊 Royaumes de l'Océan</h1>

<div id='enemyZone'>
  <div id='enemyStats'>
    <span>⚓ Amiral IA</span>
    <span class='bar-label'>❤️ <span id='enemyHpVal'></span></span>
    <div class='bar-wrap'><div class='bar-hp' id='enemyHpBar'></div></div>
    <span class='bar-label'>💎 <span id='enemyManaVal'></span></span>
    <div class='bar-wrap'><div class='bar-mana' id='enemyManaBar'></div></div>
  </div>
  <div id='enemyBoard' class='board'></div>
</div>

<hr>

<div id='playerZone'>
  <h2>🚢 Capitaine</h2>
  <div id='playerBoard' class='board'></div>
  <div id='playerStats'>
    <span class='bar-label'>❤️ <span id='playerHpVal'></span></span>
    <div class='bar-wrap'><div class='bar-hp' id='playerHpBar'></div></div>
    <span class='bar-label'>💎 <span id='manaVal'></span></span>
    <div class='bar-wrap'><div class='bar-mana' id='manaBar'></div></div>
  </div>
</div>

<h2>🃏 Main du Capitaine</h2>
<div id='hand' class='hand'></div>

<div id='controls'>
  <button id='endTurn'>Fin du tour</button>
  <button id='cancelBtn'>Annuler</button>
</div>
<div id='log'></div>

<script src='data/cards.js'></script>
<script src='js/game.js'></script>
</body></html>
